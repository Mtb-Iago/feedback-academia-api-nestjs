services:
  postgres:
    image: postgres:16-alpine
    container_name: feedback_db_postgres
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: feedback_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
